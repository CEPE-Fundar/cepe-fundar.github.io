<!-- Módulo global: Red de Expertos nadIA (se incluye en todas las páginas vía _quarto.yml; estilos en _cta-red-estilos.html) -->
<aside class="cta-red" id="cta-red" aria-labelledby="cta-red-titulo">
  <div class="cta-red-texto">
    <p class="cta-red-etiqueta">Red de Expertos nadIA</p>
    <h2 id="cta-red-titulo">Especialistas en IA, en Argentina y en el exterior</h2>
    <p>Personas que investigan, desarrollan y aplican inteligencia artificial desde la academia, el Estado, las empresas y los organismos internacionales.</p>
  </div>
  <div class="cta-red-botones">
    <a class="cta-red-boton" href="/redes/integrantes.html">Conocé a los expertos &rarr;</a>
    <a class="cta-red-boton cta-red-boton-secundario"
       href="https://docs.google.com/forms/d/e/1FAIpQLScOCj0PsBA6-61wAcX5kQmCC97kHtEozEk27NSAh8OLmh2xOA/viewform"
       target="_blank" rel="noopener noreferrer">Ser parte</a>
  </div>
</aside>
<script>
  // Ubica el módulo al final del contenido, antes del banner del footer si la página lo tiene.
  // No se muestra dentro de la sección Redes, donde sería redundante.
  (function () {
    var cta = document.getElementById("cta-red");
    if (window.location.pathname.indexOf("/redes/") !== -1) {
      cta.remove();
      return;
    }
    var footer = document.querySelector("main .site-footer");
    var main = document.querySelector("main.content") || document.querySelector("main");
    if (footer) {
      footer.parentNode.insertBefore(cta, footer);
    } else if (main) {
      main.appendChild(cta);
    }
  })();
</script>
